[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
# Deploy script reads per-chain parameters from script/config/<chainId>.json.
fs_permissions = [{ access = "read", path = "./script/config" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64

[profile.ci.fuzz]
runs = 1024

[fmt]
line_length = 120
