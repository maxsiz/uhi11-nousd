name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned to the version the project is developed with; bump deliberately in its own commit.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.1"

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # Fork tests read ETH_RPC / ARB_RPC / BASE_RPC / UNICHAIN_RPC and skip when they are unset.
      - name: Run Forge tests
        run: forge test -vvv
